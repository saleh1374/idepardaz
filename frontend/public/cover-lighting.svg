<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-label="پوشش دسته روشنایی">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101c33"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="shadeInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="deskG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="gl" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- پس‌زمینهٔ شب -->
  <rect width="640" height="360" rx="28" fill="url(#sky)"/>
  <g fill="#64748b">
    <circle cx="64" cy="48" r="2.2" opacity="0.7"/><circle cx="150" cy="30" r="1.6" opacity="0.5"/>
    <circle cx="248" cy="56" r="2.4" opacity="0.65"/><circle cx="352" cy="34" r="1.8" opacity="0.5"/>
    <circle cx="460" cy="52" r="2.2" opacity="0.6"/><circle cx="556" cy="28" r="1.6" opacity="0.45"/>
    <circle cx="604" cy="86" r="1.8" opacity="0.5"/><circle cx="38" cy="112" r="1.7" opacity="0.5"/>
    <circle cx="330" cy="90" r="1.4" opacity="0.4"/><circle cx="200" cy="24" r="1.4" opacity="0.4"/>
  </g>
  <!-- ماه -->
  <circle cx="566" cy="66" r="26" fill="#fef9c3" opacity="0.9"/>
  <circle cx="556" cy="58" r="4" fill="#fde68a" opacity="0.5"/>
  <circle cx="574" cy="72" r="3" fill="#fde68a" opacity="0.5"/>
  <circle cx="566" cy="66" r="48" fill="url(#halo)"/>

  <!-- خط افق شهر دور -->
  <g fill="#1e293b">
    <rect x="0" y="252" width="52" height="60"/>
    <rect x="58" y="236" width="34" height="76"/>
    <rect x="98" y="262" width="46" height="50"/>
    <rect x="150" y="244" width="28" height="68"/>
    <rect x="472" y="252" width="40" height="60"/>
    <rect x="518" y="238" width="30" height="74"/>
    <rect x="554" y="258" width="48" height="54"/>
    <rect x="608" y="246" width="32" height="66"/>
  </g>
  <g fill="#fbbf24" opacity="0.75">
    <rect x="70" y="250" width="5" height="6"/><rect x="82" y="264" width="5" height="6"/>
    <rect x="160" y="254" width="4" height="5"/><rect x="168" y="270" width="4" height="5"/>
    <rect x="526" y="252" width="4" height="5"/><rect x="536" y="268" width="4" height="5"/>
    <rect x="564" y="266" width="5" height="6"/><rect x="578" y="280" width="5" height="6"/>
  </g>

  <!-- مخروط نور -->
  <path d="M236 148 L96 320 L436 320 Z" fill="url(#cone)" opacity="0.85"/>

  <!-- چراغ مطالعه -->
  <g filter="url(#sh)">
    <ellipse cx="264" cy="322" rx="96" ry="12" fill="#000000" opacity="0.3"/>
    <path d="M186 300 h156 v14 a11 11 0 0 1 -11 11 h-134 a11 11 0 0 1 -11 -11 z" fill="#0f172a"/>
    <rect x="252" y="168" width="13" height="134" rx="6.5" fill="#475569"/>
    <rect x="255" y="168" width="3" height="134" rx="1.5" fill="#64748b" opacity="0.6"/>
    <path d="M258 174 C 258 128, 300 112, 344 128" stroke="#475569" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M330 96 L 398 122 L 362 182 L 300 152 Z" fill="url(#shade)"/>
    <path d="M336 104 L 390 124 L 358 176 L 308 148 Z" fill="url(#shadeInner)"/>
    <ellipse cx="352" cy="152" rx="26" ry="12" fill="#fef9c3" filter="url(#gl)"/>
  </g>

  <!-- برد LED روی میز -->
  <g filter="url(#sh)">
    <rect x="410" y="272" width="168" height="50" rx="10" fill="#065f46"/>
    <rect x="410" y="272" width="168" height="50" rx="10" stroke="#10b981" stroke-width="2" opacity="0.6"/>
    <g filter="url(#gl)">
      <circle cx="440" cy="297" r="9" fill="#fef08a"/><circle cx="478" cy="297" r="9" fill="#fef08a"/><circle cx="516" cy="297" r="9" fill="#fef08a"/><circle cx="552" cy="297" r="7" fill="#fca5a5"/>
    </g>
    <path d="M420 282 h140 M420 312 h140" stroke="#34d399" stroke-width="2" opacity="0.45"/>
  </g>

  <!-- کارت پارامتر شناور -->
  <g filter="url(#sh)">
    <rect x="56" y="64" width="196" height="92" rx="16" fill="#ffffff"/>
    <rect x="74" y="82" width="76" height="11" rx="5.5" fill="#10b981"/>
    <rect x="74" y="106" width="158" height="9" rx="4.5" fill="#e2e8f0"/>
    <rect x="74" y="124" width="112" height="9" rx="4.5" fill="#e2e8f0"/>
    <circle cx="234" cy="88" r="7" fill="#f59e0b"/>
    <circle cx="234" cy="130" r="5" fill="#38bdf8"/>
  </g>

  <!-- ستاره‌ها -->
  <g fill="#fde68a">
    <path d="M520 150 l4.5 10 l11 1.2 l-8.2 7.4 l2.3 10.8 l-9.6 -5.6 l-9.6 5.6 l2.3 -10.8 l-8.2 -7.4 l11 -1.2 z" opacity="0.9"/>
    <path d="M92 214 l3.4 7.6 l8.6 0.9 l-6.4 5.8 l1.8 8.6 l-7.4 -4.4 l-7.4 4.4 l1.8 -8.6 l-6.4 -5.8 l8.6 -0.9 z" opacity="0.65"/>
    <path d="M470 44 l2.6 5.8 l6.6 0.7 l-4.9 4.4 l1.4 6.6 l-5.7 -3.4 l-5.7 3.4 l1.4 -6.6 l-4.9 -4.4 l6.6 -0.7 z" opacity="0.7"/>
  </g>
</svg>

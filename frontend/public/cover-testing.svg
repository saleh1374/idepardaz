<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none" role="img" aria-label="پوشش دستهٔ تست و اندازه‌گیری">
  <defs>
    <linearGradient id="testBg" x1="0" y1="0" x2="640" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <radialGradient id="testGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a5b4fc" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a5b4fc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scopeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="scopeScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#052e16"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <filter id="testSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <filter id="waveGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" rx="28" fill="url(#testBg)"/>
  <circle cx="220" cy="180" r="190" fill="url(#testGlow)"/>
  <!-- شبکهٔ پس‌زمینه -->
  <g stroke="#818cf8" stroke-width="1" opacity="0.14">
    <path d="M0 90 h640 M0 180 h640 M0 270 h640"/>
    <path d="M107 0 v360 M213 0 v360 M320 0 v360 M427 0 v360 M533 0 v360"/>
  </g>

  <!-- اسیلوسکوپ -->
  <g filter="url(#testSoft)">
    <rect x="120" y="86" width="300" height="210" rx="18" fill="url(#scopeBody)"/>
    <rect x="120" y="86" width="300" height="210" rx="18" stroke="#94a3b8" stroke-width="2"/>
    <!-- صفحه -->
    <rect x="142" y="108" width="256" height="140" rx="10" fill="url(#scopeScreen)"/>
    <g stroke="#065f46" stroke-width="1.5" opacity="0.8">
      <path d="M142 143 h256 M142 178 h256 M142 213 h256"/>
      <path d="M206 108 v140 M270 108 v140 M334 108 v140"/>
    </g>
    <!-- موج -->
    <path d="M150 178 C 165 130, 180 130, 195 178 S 225 226, 240 178 S 270 130, 285 178 S 315 226, 330 178 S 360 130, 375 178 S 395 210, 398 200"
      stroke="#34d399" stroke-width="4" stroke-linecap="round" fill="none" filter="url(#waveGlow)"/>
    <!-- دکمه‌ها و پیچ‌ها -->
    <circle cx="172" cy="272" r="11" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <circle cx="172" cy="272" r="4" fill="#475569"/>
    <circle cx="206" cy="272" r="11" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <circle cx="206" cy="272" r="4" fill="#475569"/>
    <rect x="238" y="264" width="38" height="16" rx="5" fill="#fbbf24"/>
    <rect x="286" y="264" width="38" height="16" rx="5" fill="#38bdf8"/>
    <circle cx="360" cy="272" r="8" fill="#f43f5e"/>
    <circle cx="388" cy="272" r="8" fill="#22c55e"/>
  </g>

  <!-- پراب -->
  <g filter="url(#testSoft)">
    <path d="M420 210 C 470 230, 500 250, 522 268" stroke="#0f172a" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M416 200 l14 8 l-8 12 l-14 -8 z" fill="#334155"/>
    <circle cx="526" cy="272" r="7" fill="#f43f5e"/>
    <path d="M420 120 C 462 108, 496 106, 520 112" stroke="#0f172a" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="526" cy="114" r="7" fill="#22c55e"/>
  </g>

  <!-- مولتی‌متر کوچک -->
  <g filter="url(#testSoft)">
    <rect x="430" y="248" width="170" height="80" rx="16" fill="#0f172a"/>
    <rect x="430" y="248" width="170" height="80" rx="16" stroke="#334155" stroke-width="2"/>
    <rect x="446" y="262" width="86" height="34" rx="7" fill="#052e16"/>
    <path d="M452 288 h14 M472 288 h8 M486 280 v16 M496 274 l8 8 M504 274 l-8 8" stroke="#4ade80" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <circle cx="548" cy="300" r="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <path d="M548 300 l6 -8" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    <circle cx="466" cy="312" r="5" fill="#ef4444"/>
    <circle cx="486" cy="312" r="5" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- آیکون میکروسکوپ کوچک -->
  <g transform="translate(76 250)" opacity="0.95">
    <rect x="-20" y="34" width="76" height="12" rx="6" fill="#c7d2fe"/>
    <path d="M8 34 C 8 12, 26 2, 44 8" stroke="#a5b4fc" stroke-width="9" stroke-linecap="round" fill="none"/>
    <rect x="36" y="-8" width="18" height="34" rx="8" transform="rotate(28 45 9)" fill="#818cf8"/>
    <circle cx="18" cy="36" r="6" fill="#6366f1"/>
  </g>
</svg>

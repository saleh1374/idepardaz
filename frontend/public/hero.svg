<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" fill="none" role="img" aria-label="ایلاستریشن کامپایلر ایده به محصول فیزیکی">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="720" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f0fdfa"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="deskG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bulbG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="lampG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="lightCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fde68a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pcbG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#059669"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#cbd5e1" opacity="0.55"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <filter id="softer" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- پس‌زمینه -->
  <rect x="20" y="20" width="680" height="520" rx="34" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/>
  <rect x="20" y="20" width="680" height="520" rx="34" fill="url(#dots)"/>
  <circle cx="132" cy="118" r="86" fill="#d1fae5" opacity="0.55"/>
  <circle cx="614" cy="452" r="104" fill="#ccfbf1" opacity="0.6"/>
  <circle cx="640" cy="96" r="54" fill="#fef3c7" opacity="0.55"/>

  <!-- مسیر نقطه‌چین: ایده → محصول -->
  <path d="M176 176 C 250 240, 300 250, 356 300" stroke="#0d9488" stroke-width="3" stroke-dasharray="9 10" stroke-linecap="round" opacity="0.7"/>
  <path d="M346 288 L 364 304 L 342 310" stroke="#0d9488" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.7"/>

  <!-- لامپ ایده -->
  <g filter="url(#softer)">
    <circle cx="140" cy="132" r="46" fill="url(#bulbG)"/>
    <path d="M124 170 h32 v10 a8 8 0 0 1 -8 8 h-16 a8 8 0 0 1 -8 -8 z" fill="#cbd5e1"/>
    <path d="M126 186 h28" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <path d="M140 112 v28 M128 122 l10 10 M152 122 l-10 10" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  </g>
  <g stroke="#f59e0b" stroke-width="4" stroke-linecap="round" opacity="0.85">
    <path d="M140 62 v-16"/><path d="M84 88 l-12 -12"/><path d="M196 88 l12 -12"/>
    <path d="M70 140 h-16"/><path d="M210 140 h16"/>
  </g>

  <!-- میز کار -->
  <rect x="96" y="404" width="528" height="20" rx="10" fill="url(#deskG)"/>
  <rect x="140" y="424" width="16" height="72" rx="8" fill="#334155"/>
  <rect x="564" y="424" width="16" height="72" rx="8" fill="#334155"/>
  <rect x="120" y="496" width="480" height="14" rx="7" fill="#1e293b" opacity="0.9"/>

  <!-- مهتابی/چراغ رومیزی -->
  <g>
    <ellipse cx="546" cy="400" rx="46" ry="12" fill="#0f172a" opacity="0.18"/>
    <path d="M546 396 C 546 330, 552 300, 520 264" stroke="#475569" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M520 264 L 470 236" stroke="#475569" stroke-width="9" stroke-linecap="round"/>
    <path d="M448 214 L 500 240 L 470 288 L 424 258 Z" fill="url(#lampG)" filter="url(#softer)"/>
    <circle cx="452" cy="256" r="10" fill="#fde68a" filter="url(#glow)"/>
    <path d="M446 264 L 344 356 L 520 372 Z" fill="url(#lightCone)" opacity="0.75"/>
    <ellipse cx="546" cy="394" rx="34" ry="9" fill="#0f172a"/>
  </g>

  <!-- برد PCB -->
  <g filter="url(#soft)">
    <rect x="196" y="318" width="216" height="84" rx="10" fill="url(#pcbG)"/>
    <rect x="196" y="318" width="216" height="84" rx="10" stroke="#065f46" stroke-width="3"/>
    <g stroke="#6ee7b7" stroke-width="2.5" stroke-linecap="round" opacity="0.75">
      <path d="M214 336 h50 v18 h44"/>
      <path d="M214 386 h34 v-16 h60"/>
      <path d="M330 336 h60 v20"/>
    </g>
    <circle cx="214" cy="336" r="4" fill="#fcd34d"/>
    <circle cx="214" cy="386" r="4" fill="#fcd34d"/>
    <circle cx="390" cy="356" r="4" fill="#fcd34d"/>
    <rect x="248" y="348" width="44" height="30" rx="5" fill="#0f172a"/>
    <g stroke="#94a3b8" stroke-width="2.5">
      <path d="M248 356 h-7"/><path d="M248 366 h-7"/><path d="M248 376 h-7"/>
      <path d="M292 356 h7"/><path d="M292 366 h7"/><path d="M292 376 h7"/>
    </g>
    <rect x="312" y="330" width="14" height="34" rx="4" fill="#fbbf24"/>
    <path d="M315 338 h8 M315 346 h8 M315 354 h8" stroke="#b45309" stroke-width="2"/>
    <rect x="340" y="330" width="14" height="34" rx="4" fill="#fbbf24"/>
    <path d="M343 338 h8 M343 346 h8 M343 354 h8" stroke="#b45309" stroke-width="2"/>
    <circle cx="368" cy="382" r="11" fill="#f43f5e" filter="url(#glow)"/>
    <rect x="212" y="374" width="24" height="16" rx="3" fill="#e2e8f0"/>
    <rect x="374" y="324" width="30" height="16" rx="4" fill="#334155"/>
    <g fill="#fcd34d">
      <circle cx="210" cy="326" r="3.5"/><circle cx="234" cy="326" r="3.5"/>
      <circle cx="398" cy="394" r="3.5"/><circle cx="374" cy="394" r="3.5"/>
    </g>
  </g>

  <!-- کارت BOM شناور -->
  <g filter="url(#soft)">
    <rect x="428" y="66" width="236" height="128" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="448" y="86" width="86" height="12" rx="6" fill="#10b981"/>
    <rect x="612" y="84" width="34" height="16" rx="8" fill="#d1fae5"/>
    <g>
      <rect x="448" y="114" width="198" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="448" y="134" width="150" height="10" rx="5" fill="#e2e8f0"/>
      <rect x="448" y="154" width="176" height="10" rx="5" fill="#e2e8f0"/>
    </g>
    <circle cx="438" cy="119" r="5" fill="#10b981"/>
    <circle cx="438" cy="139" r="5" fill="#f59e0b"/>
    <circle cx="438" cy="159" r="5" fill="#38bdf8"/>
  </g>

  <!-- کارت قیمت شناور -->
  <g filter="url(#soft)">
    <rect x="66" y="440" width="212" height="76" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="86" y="458" width="72" height="10" rx="5" fill="#cbd5e1"/>
    <rect x="86" y="478" width="128" height="16" rx="8" fill="#059669"/>
    <rect x="222" y="478" width="36" height="16" rx="8" fill="#fef3c7"/>
    <rect x="86" y="502" width="96" height="8" rx="4" fill="#e2e8f0"/>
  </g>

  <!-- نشان تأیید -->
  <g filter="url(#soft)">
    <circle cx="632" cy="232" r="34" fill="#ffffff" stroke="#a7f3d0" stroke-width="3"/>
    <path d="M617 232 l10 11 l20 -23" stroke="#059669" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- قطعات پراکنده -->
  <g filter="url(#softer)">
    <!-- مقاومت -->
    <rect x="72" y="286" width="66" height="22" rx="11" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
    <path d="M86 287 v20 M100 287 v20 M114 287 v20" stroke="#b45309" stroke-width="4"/>
    <path d="M72 297 h-14 M138 297 h14" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <!-- باتری -->
    <rect x="596" y="318" width="72" height="34" rx="9" fill="#334155"/>
    <rect x="668" y="328" width="8" height="14" rx="3" fill="#94a3b8"/>
    <rect x="604" y="326" width="34" height="18" rx="5" fill="#10b981"/>
    <path d="M624 329 l-7 8 h6 l-6 8" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- USB -->
    <rect x="286" y="452" width="64" height="24" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <rect x="294" y="458" width="34" height="12" rx="3" fill="#64748b"/>
  </g>

  <!-- چرخ‌دنده کوچک -->
  <g transform="translate(596 132)" fill="#0d9488" opacity="0.9" filter="url(#softer)">
    <path d="M0 -26 l6 0 l2 7 a20 20 0 0 1 6 3 l6 -4 l5 5 l-4 6 a20 20 0 0 1 0 6 l4 6 l-5 5 l-6 -4 a20 20 0 0 1 -6 3 l-2 7 l-6 0 l-2 -7 a20 20 0 0 1 -6 -3 l-6 4 l-5 -5 l4 -6 a20 20 0 0 1 0 -6 l-4 -6 l5 -5 l6 4 a20 20 0 0 1 6 -3 z"/>
    <circle cx="1" cy="0" r="8" fill="#f0fdfa"/>
  </g>
</svg>
